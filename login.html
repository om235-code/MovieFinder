<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieFinder - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page auth-page">
    <div class="auth-card">
      <h1>Login</h1>

      <form id="loginForm">
        <label>Email:</label>
        <input id="email" type="email" placeholder="Enter your email" required>

        <label>Password:</label>
        <input id="password" type="password" placeholder="Enter your password" required>

        <button type="submit" class="main-btn">Login</button>
      </form>

      <p id="message" class="bottom-text"></p>

      <p class="bottom-text"><a href="register.html">Don't have an account? Register</a></p>
      <p class="bottom-text"><a href="index.html">Back to Home</a></p>
    </div>
  </div>

  <script>
    const API_BASE = "http://192.168.56.104:3000";

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const result = await response.text();

        if (result === "Login successful") {
          localStorage.setItem("loggedInUser", email);
          localStorage.setItem("mfaVerified", "false");
          window.location.href = "mfa.html";
        } else {
          message.textContent = result;
        }

      } catch (error) {
        message.textContent = "Login failed. Check backend server.";
      }
    });
  </script>
</body>
</html>
