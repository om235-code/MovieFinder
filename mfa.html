<!DOCTYPE html>
<html>
<head>
  <title>MovieFinder - MFA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="auth-card">
      <h1>Multi-Factor Authentication</h1>

      <p style="text-align:center; margin-bottom:15px;">
        Enter verification code: <b>123456</b>
      </p>

      <input id="code" type="text" placeholder="Enter MFA code">

      <button class="main-btn" onclick="verifyCode()">Verify</button>

      <p id="msg" class="bottom-text"></p>
    </div>
  </div>

<script>
function verifyCode() {
  const code = document.getElementById("code").value.trim();

  if (code === "123456") {
    localStorage.setItem("mfaVerified", "true");
    window.location.href = "index.html";
  } else {
    document.getElementById("msg").textContent = "Invalid code.";
  }
}
</script>
</body>
</html>
