<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieFinder - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page auth-page">
    <div class="auth-card">
      <h1>Register</h1>

      <form id="registerForm">
        <label>Name:</label>
        <input id="name" type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input id="email" type="email" placeholder="Enter your email">

        <label>Password:</label>
        <input id="password" type="password" placeholder="Create a password">

        <label>Confirm Password:</label>
        <input id="confirmPassword" type="password" placeholder="Confirm your password">

        <button type="submit" class="main-btn">Create Account</button>
      </form>

      <p class="bottom-text"><a href="login.html">Already have an account? Login</a></p>
      <p class="bottom-text"><a href="index.html">Back to Home</a></p>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      try {
        const response = await fetch("http://192.168.56.102:3000/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, password })
        });

        const result = await response.text();
        alert(result);
        console.log(result);
      } catch (error) {
        console.error(error);
        alert("Could not connect to backend");
      }
    });
  </script>
</body>
</html>
